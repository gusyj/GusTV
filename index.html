<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>GusTV</title>
</head>
<body>
  <header class="flex items-center justify-between flex-wrap gap-3 px-4 py-3 border-b border-border">
    <h1 class="text-xl font-semibold m-0">GusTV</h1>

    <form id="search-form" class="flex flex-1 min-w-[240px] max-w-full gap-2" role="search">
      <input
        id="search"
        type="search"
        placeholder="Search channels…"
        enterkeyhint="search"
        class="flex-1 min-w-0 w-full rounded-lg border border-border bg-panel text-ink px-3 py-2.5 text-base"
      />
      <button
        id="search-btn"
        type="submit"
        aria-label="Search"
        class="flex-none rounded-lg border border-border bg-[#1f2430] hover:bg-[#2a3040] px-3.5 py-2 text-base cursor-pointer"
      >
        🔍
      </button>
    </form>

    <nav class="flex gap-1.5 flex-none">
      <a href="index.html" class="nav-link active">Channels</a>
      <a href="player.html" class="nav-link">Direct URL</a>
    </nav>
  </header>

  <main class="grid grid-cols-1 md:grid-cols-[1fr_320px] gap-3 md:gap-4 p-3 md:p-5">
    <section class="bg-black rounded-xl overflow-hidden flex flex-col border border-border">
      <video id="player" controls playsinline class="w-full aspect-video bg-black"></video>

      <div id="load-progress" class="h-5 bg-black border-t border-border" hidden>
        <div
          id="load-progress-bar"
          class="h-full w-0 bg-accent text-[#0b1020] text-[0.7rem] leading-5 text-center whitespace-nowrap transition-[width] duration-200 ease-out"
        ></div>
      </div>

      <div class="flex flex-wrap p-2.5 px-3.5 bg-panel border-t border-border">
        <button
          id="next-btn"
          class="w-full sm:w-auto rounded-lg border border-border bg-[#1f2430] hover:bg-[#2a3040] px-4 py-2.5 text-sm cursor-pointer"
        >
          Next channel ▶
        </button>
      </div>

      <p id="now-playing" class="m-0 px-3.5 py-2.5 text-sm text-muted bg-panel">
        Select a channel to start watching.
      </p>
    </section>

    <section class="bg-panel border border-border rounded-xl p-3 max-h-[50vh] md:max-h-[80vh] overflow-y-auto">
      <h2 class="text-sm uppercase tracking-wide text-muted m-0 mb-2">Channels</h2>
      <ul id="channel-list" class="list-none m-0 p-0 flex flex-col gap-1"></ul>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
